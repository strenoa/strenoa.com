<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Strenoa — Built for your goals. Adapted to your progress.</title>
    <meta
      name="description"
      content="Strenoa — Built for your goals. Adapted to your progress. Personalized training that adapts as you train."
    />
    <link rel="canonical" href="https://strenoa.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Strenoa" />
    <meta property="og:title" content="Strenoa — Built for your goals. Adapted to your progress." />
    <meta
      property="og:description"
      content="Strenoa — Built for your goals. Adapted to your progress. Personalized training that adapts as you train."
    />
    <meta property="og:url" content="https://strenoa.com/" />
    <meta property="og:image" content="https://strenoa.com/brand/png/primary/white/strenoa-primary-logo-white-h256.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0c0c0c" />

    <link rel="manifest" href="/brand/favicons/site.webmanifest" />
    <link rel="icon" href="/brand/favicons/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/favicons/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/brand/favicons/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/brand/favicons/favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/brand/favicons/apple-touch-icon.png" />

    <link rel="preload" as="image" href="/brand/vector/strenoa-primary-logo-white.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      href="/brand/png/marketing/01-built-around-you-transparent.png"
    />
    <link rel="preload" as="font" href="/assets/fonts/dm-sans-latin.woff2" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <div class="page">
      <header class="site-header">
        <a class="brand focus-ring" href="/" aria-label="Strenoa home">
          <img
            src="/brand/png/primary/white/strenoa-primary-logo-white-h256.png"
            alt="Strenoa"
            decoding="async"
          />
        </a>
        <a class="header-link focus-ring" href="https://app.strenoa.com/support">Support</a>
      </header>

      <main>
        <section class="hero">
          <div class="hero-top-spacer" aria-hidden="true"></div>
          <div class="hero-main">
            <object
              class="logo-mark"
              type="image/svg+xml"
              data="/brand/vector/strenoa-primary-logo-white.svg"
              aria-label="Strenoa"
              role="img"
            ></object>
            <p class="tagline">Built for your goals. Adapted to your progress.</p>
            <h1 class="sr-only">Strenoa</h1>
            <div class="cta-row">
              <a
                class="app-store-badge focus-ring"
                href="https://apps.apple.com/us/app/strenoa/id6795763207"
              >
                <img
                  src="/brand/badges/app-store-badge-black.svg"
                  alt="Download on the App Store"
                  width="120"
                  height="40"
                  decoding="async"
                />
              </a>
              <a class="btn btn-secondary focus-ring" href="https://app.strenoa.com">Open app</a>
            </div>
          </div>
          <div class="hero-cue-zone">
            <a class="explore-cue focus-ring" href="#features" id="explore-cue">
              Explore the app <span aria-hidden="true">↓</span>
            </a>
          </div>
        </section>

        <section class="features" id="features" aria-label="Product features">
          <figure class="feature reveal is-visible">
            <img
              src="/brand/png/marketing/01-built-around-you-transparent.png"
              width="1320"
              height="2868"
              alt="Built Around You — Personalized to your goals, experience, schedule, and available time."
              decoding="async"
            />
          </figure>
          <figure class="feature reveal">
            <img
              src="/brand/png/marketing/02-complete-training-plan-transparent.png"
              width="1320"
              height="2868"
              alt="Your Complete Training Plan — Structured workouts that evolve across days, weeks, and months."
              loading="lazy"
              decoding="async"
            />
          </figure>
          <figure class="feature reveal">
            <img
              src="/brand/png/marketing/03-always-know-where-you-stand-transparent.png"
              width="1320"
              height="2868"
              alt="Always Know Where You Stand — See what you have completed, today's workout, and everything still ahead."
              loading="lazy"
              decoding="async"
            />
          </figure>
          <figure class="feature reveal">
            <img
              src="/brand/png/marketing/04-training-that-adapts-transparent.png"
              width="1320"
              height="2868"
              alt="Training That Adapts With You — Your next workout automatically adjusts based on how you perform."
              loading="lazy"
              decoding="async"
            />
          </figure>
          <figure class="feature reveal">
            <img
              src="/brand/png/marketing/05-know-exactly-what-to-do-transparent.png"
              width="1320"
              height="2868"
              alt="Know Exactly What to Do — See your exercises, sets, reps, and recommended starting weights before you begin."
              loading="lazy"
              decoding="async"
            />
          </figure>
          <figure class="feature reveal">
            <img
              src="/brand/png/marketing/06-log-every-set-transparent.png"
              width="1320"
              height="2868"
              alt="Log Every Set in Seconds — Track weight, reps, and effort while Strenoa guides your progression."
              loading="lazy"
              decoding="async"
            />
          </figure>
          <figure class="feature reveal">
            <img
              src="/brand/png/marketing/07-work-out-from-your-lock-screen-transparent.png"
              width="1320"
              height="2868"
              alt="Work Out From Your Lock Screen — Log effort and advance sets without reopening the app."
              loading="lazy"
              decoding="async"
            />
          </figure>
          <figure class="feature reveal">
            <img
              src="/brand/png/marketing/08-see-your-progress-transparent.png"
              width="1320"
              height="2868"
              alt="See Your Progress Over Time — Review every completed workout, set, rep, weight, and effort rating."
              loading="lazy"
              decoding="async"
            />
          </figure>
        </section>

        <section class="closing-cta reveal">
          <h2>Start training with Strenoa</h2>
          <div class="cta-row">
            <a
              class="app-store-badge focus-ring"
              href="https://apps.apple.com/us/app/strenoa/id6795763207"
            >
              <img
                src="/brand/badges/app-store-badge-black.svg"
                alt="Download on the App Store"
                width="120"
                height="40"
                decoding="async"
              />
            </a>
            <a class="btn btn-secondary focus-ring" href="https://app.strenoa.com">Open app</a>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>&copy; <span id="year">2026</span> Strenoa. All rights reserved.</span>
        <nav class="footer-links" aria-label="Legal and support">
          <a class="focus-ring" href="https://app.strenoa.com/support">Support</a>
          <a class="focus-ring" href="https://app.strenoa.com/privacy">Privacy Policy</a>
          <a class="focus-ring" href="https://app.strenoa.com/terms">Terms of Use</a>
        </nav>
      </footer>
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      (function () {
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var nodes = document.querySelectorAll(".reveal:not(.is-visible)");

        if (reduceMotion || !("IntersectionObserver" in window)) {
          document.querySelectorAll(".reveal").forEach(function (node) {
            node.classList.add("is-visible");
          });
        } else if (nodes.length) {
          var observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
              });
            },
            { rootMargin: "0px 0px -8% 0px", threshold: 0.12 }
          );

          nodes.forEach(function (node) {
            observer.observe(node);
          });
        }

        var cue = document.getElementById("explore-cue");
        var features = document.getElementById("features");
        if (!cue || !features) return;

        if (!("IntersectionObserver" in window)) {
          cue.classList.add("is-hidden");
          return;
        }

        var cueObserver = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                cue.classList.add("is-hidden");
              }
            });
          },
          { rootMargin: "0px 0px -55% 0px", threshold: 0 }
        );

        cueObserver.observe(features);
      })();
    </script>
  </body>
</html>
